<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spectra Trace | سبيكترا تريس</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f4e9;--ink:#0e3f3c;--card:#fff;--tint:#d3e2dc;--line:#dcdfd0;--acc:#C95D4F;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 "IBM Plex Sans","IBM Plex Sans Arabic",Arial,sans-serif}
[dir=rtl] body,[dir=rtl]{font-family:"IBM Plex Sans Arabic","IBM Plex Sans",Arial,sans-serif}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;justify-content:space-between;align-items:center;max-width:860px;margin:0 auto;padding:12px 18px;background:var(--bg)}
.bar b{font-size:18px}
.lang{border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:99px;padding:5px 16px;font:inherit;font-weight:700;cursor:pointer}
main{max-width:860px;margin:0 auto;padding:0 18px 36px}
section{margin-top:34px}
h1{font-size:clamp(38px,9vw,56px);line-height:1.05;margin:12px 0 8px}
h2{font-size:23px;margin:0 0 12px}
.badge{display:inline-block;border:1.5px solid var(--ink);border-radius:99px;padding:2px 14px;font-size:14px;font-weight:700}
.tag{font-size:20px;font-weight:700;margin:0 0 10px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:18px}
.btn{display:inline-block;background:var(--ink);color:#fff;text-decoration:none;border:0;border-radius:12px;padding:12px 22px;font:inherit;font-weight:700;cursor:pointer}
.btn.off{opacity:.45;pointer-events:none}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
ol.st{list-style:none;padding:0;margin:0;counter-reset:n}
ol.st li{counter-increment:n;display:flex;gap:12px;align-items:flex-start;padding:9px 0}
ol.st li:before{content:counter(n);flex:none;width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;font-weight:700;display:grid;place-items:center;font-size:15px;margin-top:2px}
.note{background:var(--tint);border-radius:14px;padding:14px 16px;margin-top:14px;font-size:15.5px}
.note p{margin:4px 0}
.note p:before{content:"●";color:var(--acc);margin-inline-end:8px;font-size:11px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.fi{display:flex;flex-direction:column;gap:8px}
.fi small{color:#4b6a67;font-size:14.5px;line-height:1.5;flex:1}
.fi h3{margin:0;font-size:18px}
.fmt{align-self:flex-start;background:var(--tint);border-radius:8px;padding:1px 10px;font-weight:700;font-size:13px}
#msg{min-height:24px;font-size:14.5px;margin-top:10px}
.gt{font-weight:700;margin:16px 0 4px}
ul.rf{list-style:none;margin:0;padding:0}
ul.rf li{padding:9px 0;border-bottom:1px solid var(--line)}
ul.rf li:last-child{border:0}
ul.rf a{color:var(--ink);font-weight:500;word-break:break-word}
ul.rf span{display:block;font-size:14px;color:#4b6a67}
.ct a{color:var(--ink);font-weight:700}
footer{text-align:center;font-size:14px;color:#4b6a67;margin-top:30px}
#pdfsrc{position:absolute;left:-9999px;top:0;width:700px;background:#fff;color:#111;padding:30px;font:15px/1.7 "IBM Plex Sans","IBM Plex Sans Arabic",Arial,sans-serif}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
</style>
</head>

</section>
